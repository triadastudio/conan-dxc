name: conan-dxc CI

on:
  push:
    branches: [ ci-test ]
  pull_request:
    branches: [ master ]

jobs:
  windows:
    runs-on: windows-2022
    steps:
    - name: Set git to use LF
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Revert to default CRLF
      run: |
        git config --global core.autocrlf true
        git config --global --unset core.eol
    - name: Install dependencies
      run: |
        python3 -m venv .venv
        ./.venv/Scripts/activate
        python3 -m pip install conan
    - name: Config
      env:
        CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_APIKEY }}
      run: |
        ./.venv/Scripts/activate
        conan remote add triada ${{ secrets.ARTIFACTORY_URL }}
        conan remote login triada ${{ secrets.ARTIFACTORY_USER }}
    - uses: ilammy/msvc-dev-cmd@v1 # Adds Windows SDK tools (mc.exe) to PATH, required by DXC build
      with:
        arch: x64
    - name: Build
      run: |
        ./.venv/Scripts/activate
        conan create . -pr:h profiles/windows.profile -pr:b profiles/windows.profile -b missing
    - name: Upload
      run: |
        ./.venv/Scripts/activate
        conan upload "dxc" -r triada -c

  linux:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        python3 -m pip install conan
    - name: Config
      env:
        CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_APIKEY }}
      run: |
        . .venv/bin/activate
        conan remote add triada ${{ secrets.ARTIFACTORY_URL }}
        conan remote login triada ${{ secrets.ARTIFACTORY_USER }}
    - name: Build
      run: |
        . .venv/bin/activate
        conan create . -pr:h profiles/linux.profile -pr:b profiles/linux.profile -b missing
    - name: Upload
      run: |
        . .venv/bin/activate
        conan upload "dxc" -r triada -c

  macos:
    runs-on: macos-15-intel
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        python3 -m pip install conan
    - name: Config
      env:
        CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_APIKEY }}
      run: |
        . .venv/bin/activate
        conan remote add triada ${{ secrets.ARTIFACTORY_URL }}
        conan remote login triada ${{ secrets.ARTIFACTORY_USER }}
    - name: Build
      run: |
        . .venv/bin/activate
        conan create . -pr:h profiles/macos.profile -pr:b profiles/macos.profile -b missing
    - name: Upload
      run: |
        . .venv/bin/activate
        conan upload "dxc" -r triada -c

  macos-armv8:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: 'recursive'
    - name: Install dependencies
      run: |
        python3 -m venv .venv
        . .venv/bin/activate
        python3 -m pip install conan
    - name: Config
      env:
        CONAN_PASSWORD: ${{ secrets.ARTIFACTORY_APIKEY }}
      run: |
        . .venv/bin/activate
        conan remote add triada ${{ secrets.ARTIFACTORY_URL }}
        conan remote login triada ${{ secrets.ARTIFACTORY_USER }}
    - name: Build
      run: |
        . .venv/bin/activate
        conan create . -pr:h profiles/macos-armv8.profile -pr:b profiles/macos-armv8.profile -b missing
    - name: Upload
      run: |
        . .venv/bin/activate
        conan upload "dxc" -r triada -c
